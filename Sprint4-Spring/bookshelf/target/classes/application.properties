# Database connection 
spring.datasource.url=jdbc:h2:mem:bookshelf
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql and data.sql on every startup (re-seeds the demo database EVERY TIME YOU RUN THIS)
spring.sql.init.mode=always

# MyBatis
# Where the XML mapper files live
mybatis.mapper-locations=classpath:mappers/*.xml
# Translate the database's snake_case columns into Java's camelCase fields automatically
mybatis.configuration.map-underscore-to-camel-case=true
